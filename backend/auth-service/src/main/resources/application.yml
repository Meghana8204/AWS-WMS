server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ams_auth}
    username: ${DB_USER:ams_auth}
    password: ${DB_PASSWORD:ams_auth}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ams:
  security:
    jwt:
      issuer: ams-auth-service
      audience: ams-business-service
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30

      private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/dev-private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/dev-public.pem}
      key-id: ${JWT_KEY_ID:dev-key-1}
    password:
      bcrypt-strength: 12

logging:
  level:
    com.ams.auth: INFO
