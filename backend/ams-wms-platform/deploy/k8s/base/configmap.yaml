apiVersion: v1
kind: ConfigMap
metadata:
  name: business-service-config
  namespace: ams-wms
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  AUTH_SERVICE_BASE_URL: "http://auth-service:8080"
  JWT_JWKS_URL: "http://auth-service:8080/.well-known/jwks.json"
  JWT_ISSUER: "ams-auth-service"
  JWT_AUDIENCE: "ams-business-service"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_PREFIX: "ams"
  KAFKA_CONSUMER_GROUP: "business-service-notification"
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: ams-wms
data:
  DB_HOST: "postgres-auth"
  DB_PORT: "5432"
  DB_NAME: "ams_auth"
