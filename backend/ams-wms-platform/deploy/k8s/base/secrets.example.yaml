# Template only - never commit real secrets. Apply your own copy with
# `kubectl apply -f`, or generate via your secret manager / External
# Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: business-service-secrets
  namespace: ams-wms
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://ams_business:CHANGE_ME@postgres-business:5432/ams_business"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: ams-wms
type: Opaque
stringData:
  DB_USER: "ams_auth"
  DB_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-jwt-keys
  namespace: ams-wms
type: Opaque
stringData:
  # Replace with a production RSA keypair - never the dev keys committed
  # under backend/auth-service/src/main/resources/keys/.
  private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
