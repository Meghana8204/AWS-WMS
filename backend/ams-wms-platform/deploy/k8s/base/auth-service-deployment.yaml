apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ams-wms
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ams-registry/auth-service:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: auth-service-config }
            - secretRef: { name: auth-service-secrets }
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/ams/keys
              readOnly: true
          env:
            - name: JWT_PRIVATE_KEY_PATH
              value: "file:/etc/ams/keys/private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "file:/etc/ams/keys/public.pem"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: jwt-keys
          secret: { secretName: auth-service-jwt-keys }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ams-wms
spec:
  selector: { app: auth-service }
  ports:
    - port: 8080
      targetPort: 8080
