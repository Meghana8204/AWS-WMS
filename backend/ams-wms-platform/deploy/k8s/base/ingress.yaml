apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ams-wms-ingress
  namespace: ams-wms
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: ams-wms.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: { service: { name: auth-service, port: { number: 8080 } } }
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: auth-service, port: { number: 8080 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: business-service, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 5173 } } }
