apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: ams-wms
spec:
  replicas: 3
  selector:
    matchLabels: { app: business-service }
  template:
    metadata:
      labels: { app: business-service }
    spec:
      containers:
        - name: business-service
          image: ams-registry/business-service:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: business-service-config }
            - secretRef: { name: business-service-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: business-service
  namespace: ams-wms
spec:
  selector: { app: business-service }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: business-service-hpa
  namespace: ams-wms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: business-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
