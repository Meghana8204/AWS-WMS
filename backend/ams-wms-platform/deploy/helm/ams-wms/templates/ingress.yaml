{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ams-wms-ingress
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: { service: { name: auth-service, port: { number: {{ .Values.authService.port }} } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: business-service, port: { number: {{ .Values.businessService.port }} } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: {{ .Values.frontend.port }} } } }
{{- end }}
