authService:
  image:
    repository: ams-registry/auth-service
    tag: latest
  replicas: 2
  port: 8080

businessService:
  image:
    repository: ams-registry/business-service
    tag: latest
  replicas: 3
  port: 8000
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    targetCpuUtilization: 70

frontend:
  image:
    repository: ams-registry/frontend
    tag: latest
  replicas: 2
  port: 5173

ingress:
  enabled: true
  host: ams-wms.example.com

postgres:
  auth:
    host: postgres-auth
  business:
    host: postgres-business

kafka:
  bootstrapServers: kafka:9092

redis:
  url: redis://redis:6379/0
